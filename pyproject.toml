[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siteforge"
version = "0.1.0"
description = "Approval-gated hybrid website portfolio supervisor and Windows worker"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "pydantic>=2.10,<3", "psutil>=6,<8", "cryptography==50.0.2", "filelock==4.2.4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1", "mypy>=1.15,<2", "pip-audit>=2.8,<3"]

[tool.setuptools.packages.find]
include = ["siteforge*", "benchmarks*"]

[tool.setuptools.package-data]
benchmarks = ["datasets/*.json", "datasets/*.jsonl", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
