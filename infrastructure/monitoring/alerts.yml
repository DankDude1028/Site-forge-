groups:
  - name: siteforge
    rules:
      - alert: SiteForgeUnavailable
        expr: up{job="siteforge"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "SiteForge supervisor unavailable"}
      - alert: SiteForgeWorkerOffline
        expr: sum(siteforge_workers{state="online"}) == 0
        for: 3m
        labels: {severity: warning}
        annotations: {summary: "GPU work waits until the Windows worker reconnects"}
